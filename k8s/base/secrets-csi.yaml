# SecretProviderClass - Mounts Azure Key Vault secrets into pods
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-secrets
  namespace: realestate
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "" # Set via overlay per environment
    keyvaultName: ""           # Set via overlay per environment
    tenantId: ""               # Set via overlay per environment
    objects: |
      array:
        - |
          objectName: cosmosdb-connection-string
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: storage-access-key
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
  secretObjects:
    - secretName: app-secrets
      type: Opaque
      data:
        - objectName: cosmosdb-connection-string
          key: MONGODB_URI
        - objectName: redis-connection-string
          key: REDIS_URL
        - objectName: storage-access-key
          key: STORAGE_ACCESS_KEY
        - objectName: jwt-secret
          key: JWT_SECRET
