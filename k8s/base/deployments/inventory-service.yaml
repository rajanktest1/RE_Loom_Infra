apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: realestate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: realestate/inventory-service
          ports:
            - containerPort: 4002
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PORT
              value: "4002"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGODB_URI
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /inventory/health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /inventory/health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 20
