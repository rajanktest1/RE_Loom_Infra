apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-service
  namespace: realestate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-service
  template:
    metadata:
      labels:
        app: crm-service
    spec:
      containers:
        - name: crm-service
          image: realestate/crm-service
          ports:
            - containerPort: 4004
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PORT
              value: "4004"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGODB_URI
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /crm/health
              port: 4004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /crm/health
              port: 4004
            initialDelaySeconds: 15
            periodSeconds: 20
