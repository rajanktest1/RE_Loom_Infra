apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: realestate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      containers:
        - name: document-service
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 4006
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PORT
              value: "4006"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGODB_URI
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: STORAGE_ACCESS_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /documents/health
              port: 4006
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /documents/health
              port: 4006
            initialDelaySeconds: 15
            periodSeconds: 20
