apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: realestate
data:
  NODE_ENV: "production"
  # Service discovery (within K8s cluster)
  AUTH_SERVICE_URL: "http://auth-service:4001"
  INVENTORY_SERVICE_URL: "http://inventory-service:4002"
  SUPPLY_CHAIN_SERVICE_URL: "http://supply-chain-service:4003"
  CRM_SERVICE_URL: "http://crm-service:4004"
  NOTIFICATION_SERVICE_URL: "http://notification-service:4005"
  DOCUMENT_SERVICE_URL: "http://document-service:4006"
  # RabbitMQ (in-cluster StatefulSet)
  RABBITMQ_URL: "amqp://rabbitmq:rabbitmq@rabbitmq-0.rabbitmq:5672"
  # Ports
  GATEWAY_PORT: "4000"
  AUTH_PORT: "4001"
  INVENTORY_PORT: "4002"
  SUPPLY_CHAIN_PORT: "4003"
  CRM_PORT: "4004"
  NOTIFICATION_PORT: "4005"
  DOCUMENT_PORT: "4006"
