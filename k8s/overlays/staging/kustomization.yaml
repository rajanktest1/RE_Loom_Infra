apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: realestate

resources:
  - ../../base

patches:
  # Staging replicas
  - target:
      kind: Deployment
      name: gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

  # Override ConfigMap for staging
  - target:
      kind: ConfigMap
      name: app-config
    patch: |
      - op: replace
        path: /data/NODE_ENV
        value: "staging"
      - op: add
        path: /data/LOG_LEVEL
        value: "info"

images:
  - name: realestate/gateway
    newName: acrrealestateshared.azurecr.io/realestate/gateway
    newTag: latest
  - name: realestate/auth-service
    newName: acrrealestateshared.azurecr.io/realestate/auth-service
    newTag: latest
  - name: realestate/inventory-service
    newName: acrrealestateshared.azurecr.io/realestate/inventory-service
    newTag: latest
  - name: realestate/supply-chain-service
    newName: acrrealestateshared.azurecr.io/realestate/supply-chain-service
    newTag: latest
  - name: realestate/crm-service
    newName: acrrealestateshared.azurecr.io/realestate/crm-service
    newTag: latest
  - name: realestate/notification-service
    newName: acrrealestateshared.azurecr.io/realestate/notification-service
    newTag: latest
  - name: realestate/document-service
    newName: acrrealestateshared.azurecr.io/realestate/document-service
    newTag: latest
  - name: realestate/web
    newName: acrrealestateshared.azurecr.io/realestate/web
    newTag: latest
