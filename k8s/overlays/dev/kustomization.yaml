apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: realestate

resources:
  - ../../base

patches:
  # Scale down for dev
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # Dev-specific HPA - lower limits
  - target:
      kind: HorizontalPodAutoscaler
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  # Override ConfigMap for dev
  - target:
      kind: ConfigMap
      name: app-config
    patch: |
      - op: replace
        path: /data/NODE_ENV
        value: "development"
      - op: add
        path: /data/LOG_LEVEL
        value: "debug"

images:
  - name: IMAGE_PLACEHOLDER
    newName: acrrealestateshared.azurecr.io/realestate/gateway
    newTag: latest
  - name: IMAGE_PLACEHOLDER
    newName: acrrealestateshared.azurecr.io/realestate/auth-service
    newTag: latest
  - name: IMAGE_PLACEHOLDER
    newName: acrrealestateshared.azurecr.io/realestate/inventory-service
    newTag: latest
  - name: IMAGE_PLACEHOLDER
    newName: acrrealestateshared.azurecr.io/realestate/supply-chain-service
    newTag: latest
  - name: IMAGE_PLACEHOLDER
    newName: acrrealestateshared.azurecr.io/realestate/crm-service
    newTag: latest
  - name: IMAGE_PLACEHOLDER
    newName: acrrealestateshared.azurecr.io/realestate/notification-service
    newTag: latest
  - name: IMAGE_PLACEHOLDER
    newName: acrrealestateshared.azurecr.io/realestate/document-service
    newTag: latest
  - name: IMAGE_PLACEHOLDER
    newName: acrrealestateshared.azurecr.io/realestate/web
    newTag: latest
